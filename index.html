<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N5ND5KQVH3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N5ND5KQVH3');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thekedaar Results</title>
  <meta http-equiv="refresh" content="30" />

  <style>
    /* BASE */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #0A0A0A;
      color: white;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      background-color: rgba(30, 58, 138, 0.85);
    }
    .logo img {
      width: 150px;
      height: auto;
      margin-bottom: 10px;
    }
    nav {
      display: flex;
      gap: 15px;
    }
    nav a {
      color: #FBBF24;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }
    nav a:hover { text-decoration: underline; }

    /* TITLE */
    #title {
      text-align: center;
      font-size: 3em;
      margin-top: 40px;
      background: linear-gradient(90deg, #ff00cc, #3333ff, #00ffcc, #ffcc00);
      background-size: 200% auto;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      animation: shimmer 3s linear infinite, glow 1.5s ease-in-out infinite;
    }
    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 10px #fff, 0 0 20px #ff00cc, 0 0 30px #3333ff; }
      50% { text-shadow: 0 0 20px #fff, 0 0 30px #00ffcc, 0 0 40px #ffcc00; }
    }

    /* MAIN SCORE */
    .main-score {
      text-align: center;
      font-size: 2.5em;
      font-weight: 900;
      color: gold;
      margin-top: 20px;
      text-shadow: 0 0 10px gold, 0 0 20px #ffcc00, 0 0 30px #ffaa00;
    }
    .morning {
      color: #00ffff;
      font-size: 2em;
      font-weight: 900;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #33ccff, 0 0 30px #66ffff;
      margin: 10px 0;
    }
    .evening {
      color: #ff66cc;
      font-size: 2em;
      font-weight: 900;
      text-shadow: 0 0 10px #ff66cc, 0 0 20px #ff3399, 0 0 30px #ff99cc;
      margin: 10px 0;
    }

    /* CIRCLES */
    .circle-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
    }
    .circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ADD8E6;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
      transition: transform 0.3s ease;
      color: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
    }
    .circle:hover { transform: scale(1.1); }
    .score { font-size: 20px; font-weight: 900; margin-top: 5px; }

    /* DATE */
    #current-date {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      color: gold;
      margin-top: 60px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px gold;
    }

    /* CHART */
    #chart-data table {
      width: 90%;
      margin: 40px auto;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
    }
    #chart-data th, #chart-data td {
      padding: 14px 20px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #f1f1f1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    #chart-data th {
      background: linear-gradient(90deg, #FFD700, #FFA500);
      color: #000;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }
    .morning-cell {
      color: #00ffff;
      font-weight: 900;
      text-shadow: 0 0 8px #00ffff, 0 0 16px #33ccff;
    }
    .evening-cell {
      color: #ff66cc;
      font-weight: 900;
      text-shadow: 0 0 8px #ff66cc, 0 0 16px #ff3399;
    }

    /* FIREWORKS */
    .firework {
      position: absolute;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: burst 1s ease-out forwards;
    }
    @keyframes burst {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    .firework::after {
      content: "✦";
      position: absolute;
      top: -6px;
      left: -6px;
      font-size: 12px;
      color: gold;
      animation: sparkle 1s ease-out forwards;
    }
    @keyframes sparkle {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(2); }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="logo"><img src="assets/logo.png" alt="Thekedaar Logo" /></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="disclaimer.html">Disclaimer</a>
      <a href="terms-of-service.html">Terms of Service</a>
    </nav>
  </header>

  <!-- TITLE -->
  <h1 id="title">Thekedaar</h1>

  <!-- MAIN SCORE -->
  <div id="main-score" class="main-score">—</div>

  <!-- CIRCLE RESULTS -->
  <div class="circle-container" id="results"></div>

  <!-- DATE -->
  <div id="current-date"></div>

  <!-- CHART TAB -->
  <h2>
    Chart
    <select id="year-select"></select>
  </h2>
  <div id="chart-data"></div>
    <!-- GOOGLE SHEETS API -->
  <script>
    const apiKey = "AIzaSyA6MZr97k_P2vLEd3izI3F7UZLJMCvE6WA"; // your API key here
    const sheetId = "1UIFwICEddQE5XtMz_Wod3Gp0H6TQwTvE2TCeXw77-sQ";
    const resultsTab = "results";

    // Load Results
    async function loadResults() {
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${resultsTab}?key=${apiKey}`;
      try {
        const response = await fetch(url);
        const data = await response.json();
        const rows = data.values;
        const container = document.getElementById("results");
        const mainScore = document.getElementById("main-score");
        container.innerHTML = "";
        mainScore.innerHTML = "";

        rows.forEach(row => {   // ✅ no slice(1), so Morning row is included
          const game = row[0];
          const score = row[1] || "—";

          if (game && game.toLowerCase() === "thekedaar morning") {
            mainScore.innerHTML += `
              <div class="morning">
                Thekedaar Morning: <span class="score">${score}</span>
              </div>
            `;
          } else if (game && game.toLowerCase() === "thekedaar evening") {
            mainScore.innerHTML += `
              <div class="evening">
                Thekedaar Evening: <span class="score">${score}</span>
              </div>
            `;
          } else {
            const circle = document.createElement("div");
            circle.className = "circle";
            const name = document.createElement("span");
            name.textContent = game;
            const value = document.createElement("span");
            value.className = "score";
            value.textContent = score;
            circle.appendChild(name);
            circle.appendChild(value);
            container.appendChild(circle);
          }
        });
      } catch (error) {
        console.error("Error loading results:", error);
        document.getElementById("results").innerHTML = "<p>Unable to load results. Please try again later.</p>";
      }
    }

    // Load Chart by Year
    async function loadChart(year) {
      const chartTab = `chart_${year}`;
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${chartTab}?key=${apiKey}`;
      try {
        const response = await fetch(url);
        const data = await response.json();
        const rows = data.values;
        let html = "<table class='chart-table'>";
        rows.forEach((row, index) => {
          html += "<tr>";
          row.forEach((cell, i) => {
            if (i === 1 && index > 0) {
              html += `<td class="morning-cell">${cell}</td>`;
            } else if (i === 2 && index > 0) {
              html += `<td class="evening-cell">${cell}</td>`;
            } else {
              html += `<td>${cell}</td>`;
            }
          });
          html += "</tr>";
        });
        html += "</table>";
        document.getElementById("chart-data").innerHTML = html;
      } catch (error) {
        console.error("Error loading chart:", error);
        document.getElementById("chart-data").innerHTML = "<p>Unable to load chart data. Please try again later.</p>";
      }
    }

    // Date updater
    function updateDate() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      const formatted = `${day}/${month}/${year} IST`;
      document.getElementById("current-date").textContent = formatted;
    }

    // Populate dropdown dynamically
    function populateYearDropdown(startYear = 2023) {
      const currentYear = new Date().getFullYear();
      const select = document.getElementById("year-select");
      select.innerHTML = "";
      for (let y = startYear; y <= currentYear; y++) {
        const option = document.createElement("option");
        option.value = y;
        option.textContent = y;
        select.appendChild(option);
      }
      select.value = currentYear;
    }

    // Event listener for dropdown
    document.getElementById("year-select").addEventListener("change", function() {
      loadChart(this.value);
    });

    // Initial load
    const currentYear = new Date().getFullYear();
    populateYearDropdown(2023);
    loadResults();
    loadChart(currentYear);
    updateDate();
  </script>

  <!-- FIREWORKS -->
  <script>
    function createFirework() {
      const firework = document.createElement("div");
      firework.classList.add("firework");
      firework.style.left = Math.random() * window.innerWidth + "px";
      firework.style.top = Math.random() * window.innerHeight + "px";
      document.body.appendChild(firework);
      setTimeout(() => firework.remove(), 1000);
    }

    setInterval(() => {
      if (document.querySelectorAll(".firework").length < 20) {
        createFirework();
      }
    }, 800);
  </script>
</body>
</html>
