<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Results Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    label {
      margin-right: 10px;
    }
    select {
      margin-right: 20px;
      padding: 5px;
    }
    canvas {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Results Viewer</h2>

  <!-- Dropdowns -->
  <label for="viewMode">View Mode:</label>
  <select id="viewMode">
    <option value="yearly">Yearly</option>
    <option value="monthly">Monthly</option>
  </select>

  <label for="yearSelect">Year:</label>
  <select id="yearSelect"></select>

  <label for="monthSelect">Month:</label>
  <select id="monthSelect"></select>

  <!-- Chart -->
  <canvas id="resultsChart" width="600" height="400"></canvas>

  <script>
    // Example dataset (replace with your actual data or API response)
    const resultsData = {
      "2022": { "Jan": 12, "Feb": 18, "Mar": 25, "Apr": 30, "May": 22 },
      "2023": { "Jan": 20, "Feb": 30, "Mar": 40, "Apr": 50, "May": 35 },
      "2024": { "Jan": 15, "Feb": 22, "Mar": 35, "Apr": 45, "May": 28 },
      "2025": { "Jan": 10, "Feb": 28, "Mar": 45, "Apr": 55, "May": 42 },
      "2026": { "Jan": 14, "Feb": 19 } // current year, partial months
    };

    const viewMode = document.getElementById("viewMode");
    const yearSelect = document.getElementById("yearSelect");
    const monthSelect = document.getElementById("monthSelect");
    const currentYear = new Date().getFullYear();

    // Populate year dropdown dynamically
    for (let year = 2022; year <= currentYear; year++) {
      let opt = document.createElement("option");
      opt.value = year;
      opt.textContent = year;
      yearSelect.appendChild(opt);
    }

    // Chart initialization
    const ctx = document.getElementById("resultsChart").getContext("2d");
    let chart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: [],
        datasets: [{
          label: "Results",
          data: [],
          backgroundColor: "rgba(75, 192, 192, 0.6)"
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: true }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    function updateMonths(year) {
      monthSelect.innerHTML = "";
      Object.keys(resultsData[year]).forEach(month => {
        let opt = document.createElement("option");
        opt.value = month;
        opt.textContent = month;
        monthSelect.appendChild(opt);
      });
    }

    function updateChart() {
      const year = yearSelect.value;
      const mode = viewMode.value;

      if (mode === "yearly") {
        chart.config.type = "line"; // yearly view as line chart
        chart.data.labels = Object.keys(resultsData[year]);
        chart.data.datasets[0].data = Object.values(resultsData[year]);
      } else {
        chart.config.type = "bar"; // monthly view as bar chart
        const month = monthSelect.value;
        chart.data.labels = [month];
        chart.data.datasets[0].data = [resultsData[year][month]];
      }
      chart.update();
    }

    // Event listeners
    viewMode.addEventListener("change", () => {
      if (viewMode.value === "yearly") {
        monthSelect.style.display = "none";
      } else {
        monthSelect.style.display = "inline-block";
      }
      updateChart();
    });

    yearSelect.addEventListener("change", () => {
      updateMonths(yearSelect.value);
      updateChart();
    });

    monthSelect.addEventListener("change", updateChart);

    // Initialize with current year in yearly mode
    yearSelect.value = currentYear;
    updateMonths(currentYear);
    monthSelect.value = Object.keys(resultsData[currentYear])[0];
    monthSelect.style.display = "none"; // hide initially for yearly mode
    updateChart();
  </script>
</body>
</html>
